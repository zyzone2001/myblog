baseURL = 'https://zyzone.top/'
languageCode = 'zh-cn'
title = 'ZYZONE'
theme = 'PaperMod'

[params]
defaultTheme = 'auto' #主题跟随
disableThemeToggle = false #主题切换不显示
ShowReadingTime = false #展示阅读时间
ShowToc = true #博客文章中展示目录
ShowCodeCopyButtons = true #展示代码复制按钮
ShowBreadCrumbs = false #显示面包碎导航
displayFullLangName = true #显示完整语言名称，暂时没有启用多语言的打算
mainSections = ["posts"] #指定posts是网站的主要文章板块。
ShowRssButtonInSectionTermList = true #支持的文章列表、分类或标签列表页面显示RSS订阅按钮
ShowFullTextinRSS = true #控制RSS中是否包含完整正文

#欢迎页面的设置
[params.homeInfoParams]
Title = "你好，欢迎你来"
Content = "分享一些技术，思考，还有碎碎念"


